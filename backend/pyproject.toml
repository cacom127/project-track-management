[project]
name = "project-track-api"
version = "0.1.0"
description = "Backend API cho 実績管理システム"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.72",
    "fastapi>=0.141.1",
    "mangum>=0.21.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
